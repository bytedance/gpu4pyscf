# Pin the pytest rootdir to this directory.
#
# Without this file pytest discovers the rootdir at the repository root and,
# because every parent directory (gpu4pyscf/, qmmm/, embedding/) ships an
# __init__.py, it builds a chain of ``Package`` collector nodes.  Setting up the
# top-level ``gpu4pyscf`` package node eagerly imports ``gpu4pyscf/__init__.py``
# which touches the CUDA runtime at import time -- crashing the *pure-CPU* tests
# on machines without a usable GPU driver.
#
# Pinning the rootdir here keeps collection inside the validation package, so the
# CPU math tests run anywhere and only the GPU-gated tests probe CUDA (and skip
# gracefully when it is unavailable).
[pytest]
testpaths = tests
addopts = -ra
